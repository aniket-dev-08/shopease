# Port: hosting sites set PORT, locally it is 8080
server.port=${PORT:8080}

# Optional local file for secrets (not committed to Git). Example content:  DB_PASSWORD=your_mysql_password
spring.config.import=optional:file:./.env.properties,optional:file:./backend/.env.properties

# Values below can be overridden with environment variables (the text after ":" is the default)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shopease?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# JWT secret must be at least 32 characters
jwt.secret=${JWT_SECRET:ShopEaseSuperSecretKeyForJwtSigning12345}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Website address(es) allowed to call this API (comma separated, no trailing slash)
app.cors-origin=${CORS_ORIGIN:http://localhost:5173}

# First admin account, created only when the users table is empty
app.admin-email=${ADMIN_EMAIL:admin@shopease.com}
app.admin-password=${ADMIN_PASSWORD:admin123}
